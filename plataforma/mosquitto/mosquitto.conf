# Eclipse Mosquitto 2.1 — broker de la plataforma SHM.

# Los mensajes QoS 1 y las sesiones persistentes sobreviven a un reinicio.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Nadie entra sin usuario; cada estación solo escribe en SU rama (acl).
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Límites: un registro pesa ~1 KB; 256 KB deja margen y corta abusos.
message_size_limit 262144
max_queued_messages 100000

# Red interna de Docker y, publicado en el equipo, solo en 127.0.0.1 (ver compose).
listener 1883

# Producción: TLS en 8883. Descomentar y montar los certificados (ARQUITECTURA.md §10).
#listener 8883
#cafile /mosquitto/certs/ca.crt
#certfile /mosquitto/certs/servidor.crt
#keyfile /mosquitto/certs/servidor.key
#require_certificate true
#use_identity_as_username true
